[project]
name = "statistical-rethinking-python"
version = "0.1.0"
description = "Executable Python companion to Statistical Rethinking 2026"
requires-python = ">=3.13,<3.14"
dependencies = [
    "altair>=5,<7",
    "arviz>=0.21,<1",
    "marimo>=0.20,<1",
    "numpy>=2,<3",
    "pandas>=2,<4",
    "pymc>=5.24,<6",
    "scipy>=1.15,<2",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rethinking_companion"]
